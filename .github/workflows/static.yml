name: Deploy Rádio Camaleão

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Preparar imagens e banners
        run: |
          mkdir -p public/slides
          cp -f *.jpg *.png public/ 2>/dev/null || true
          cp -f banner_principal.jpg public/banner_secundario.jpg 2>/dev/null || true
          cp -f banner_principal.jpg public/slides/slide_1.jpg 2>/dev/null || true
          sed -i 's|https://scontent.fpoa[^"'\'']*|./banner_principal.jpg|g' src/components/MainBanners.tsx 2>/dev/null || true
          sed -i 's|https://scontent.fpoa[^"'\'']*|./banner_principal.jpg|g' src/components/BannerSlider.tsx 2>/dev/null || true

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Compilar projeto
        run: npm run build || npx vite build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fazer upload do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
